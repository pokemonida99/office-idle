<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#1d1730">
<title>不想上班！放置辦公室</title>
<meta name="description" content="小葵、小米、阿傑和 Vivi 老闆一起打倒工作怪的放置小遊戲。免費、不用登入、打開就能玩。">
<meta property="og:title" content="不想上班！放置辦公室">
<meta property="og:description" content="打倒改稿單、奧客電話和無限會議，準時下班！">
<meta property="og:image" content="art/ui/title.webp">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💼</text></svg>">
<link rel="stylesheet" href="style.css?v=7">
</head>
<body>
<div id="app">
  <header id="top">
    <div class="stage"><b id="stDay">週一</b><div class="stInfo"><span id="stCode">1-1</span><span id="stName">打卡</span></div></div>
    <div id="waves"></div>
    <div class="gold" id="goldBox"><i class="coin"></i><b id="gold">0</b></div>
    <button id="btnSet" class="icon" aria-label="設定">⚙️</button>
  </header>
  <div id="stageWrap">
    <canvas id="cv"></canvas>
    <div id="celebrate" hidden><div class="cb"><div class="ic"></div><div class="tx"><b></b><small></small></div></div></div>
    <div id="buffs"><span id="bfGold" title="薪水加倍" hidden></span><span id="bfAspd" title="攻速提升" hidden></span><span id="bfAtk" title="攻擊加倍" hidden></span></div>
    <div id="tips"><div id="hint" hidden></div><div id="toasts"></div></div>
  </div>
  <div id="team"></div>
  <div id="ultRow">
    <label class="sw" id="autoWrap" hidden><input type="checkbox" id="autoUlt"><i></i>自動大招</label>
    <label class="sw" id="autoBuyWrap" hidden><input type="checkbox" id="autoBuy"><i></i>自動升級</label>
    <button id="cheer" class="chip" hidden></button>
    <button id="btnChest" class="chip chestBtn" hidden><i></i><b id="chestN">0</b></button>
    <span id="dps"></span>
    <button id="btnBoss" hidden>⚔️ 挑戰頭目</button>
  </div>
  <main id="panel"></main>
  <nav id="tabs">
    <button data-tab="staff" class="on"><em>👥</em><span>員工</span><i class="dot" id="staffDot" hidden></i></button>
    <button data-tab="office"><em>🏢</em><span>辦公室</span><i class="dot" id="officeDot" hidden></i></button>
    <button data-tab="quest"><em>📋</em><span>任務</span><i class="dot" id="questDot" hidden></i></button>
    <button data-tab="loot"><em>💎</em><span>寶物</span><i class="dot" id="lootDot" hidden></i></button>
  </nav>
</div>

<div id="title" class="overlay">
  <div class="titleArt"></div>
  <div class="titleBox">
    <h1><small>a4 不想上班 出品</small>不想上班！<br>放置辦公室</h1>
    <p>打倒改稿單、奧客電話和無限會議，<br>帶大家準時下班！</p>
    <div class="load" id="load"><i id="loadBar"></i></div>
    <button id="btnStart" class="big">開始上班</button>
    <p class="note">免費・不用登入・進度存在這台裝置</p>
    <p class="ver">版本 <b id="verTxt">v1.2.0</b></p>
  </div>
</div>

<div id="story" class="overlay" hidden>
  <button id="btnSkip" class="skip">跳過 ⏭</button>
  <div class="dlg">
    <div class="who"><div class="face"></div><b class="name"></b></div>
    <p class="text"></p>
    <span class="next">點一下繼續 ▶</span>
  </div>
</div>

<div id="modal" class="overlay" hidden><div class="box"></div></div>

<div id="chestUI" class="overlay" hidden>
  <div class="cbox">
    <div class="cstage"><div class="rays"></div><div class="chestImg"></div><div class="reveal" hidden><div class="rimg"></div><div class="rtag"></div><b class="rname"></b><div class="rstar"></div><p class="rfx"></p><p class="rlore"></p></div></div>
    <div class="clist" hidden></div>
    <p class="cinfo"></p>
    <div class="btns"><button id="cOpen" class="pri">打開</button><button id="cAll">全部打開</button><button id="cClose">關閉</button></div>
  </div>
</div>
<script src="js/data.js?v=7"></script>
<script src="js/engine.js?v=7"></script>
<script src="js/audio.js?v=7"></script>
<script src="js/render.js?v=7"></script>
<script src="js/ui.js?v=7"></script>
</body>
</html>
