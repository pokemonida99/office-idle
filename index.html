<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#1d1730">
<title>不想上班！放置辦公室</title>
<meta name="description" content="小葵、小米、阿傑和 Vivi 老闆一起打倒工作怪的放置小遊戲。免費、不用登入、打開就能玩。">
<meta property="og:title" content="不想上班！放置辦公室">
<meta property="og:description" content="打倒改稿單、奧客電話和無限會議，準時下班！">
<meta property="og:image" content="art/ui/title.webp">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💼</text></svg>">
<link rel="stylesheet" href="style.css?v=2">
</head>
<body>
<div id="app">
  <header id="top">
    <div class="stage"><b id="stDay">週一</b><span id="stCode">1-1</span><span id="stName">打卡</span></div>
    <div id="waves"></div>
    <div class="gold"><i>💰</i><b id="gold">0</b></div>
    <button id="btnSet" class="icon" aria-label="設定">⚙️</button>
  </header>
  <div id="stageWrap">
    <canvas id="cv"></canvas>
    <div id="hint" hidden></div>
    <button id="btnBoss" hidden>⚔️ 再次挑戰頭目</button>
  </div>
  <div id="team"></div>
  <div id="ultRow"><label id="autoWrap" hidden><input type="checkbox" id="autoUlt"> 自動大招</label><span id="dps"></span></div>
  <main id="panel"></main>
  <nav id="tabs">
    <button data-tab="staff" class="on">👥<span>員工</span></button>
    <button data-tab="office">🏢<span>辦公室</span></button>
    <button data-tab="quest">📋<span>任務</span><i class="dot" id="questDot" hidden></i></button>
    <button data-tab="loot">🏆<span>收藏</span></button>
  </nav>
</div>

<div id="title" class="overlay">
  <div class="titleArt"></div>
  <div class="titleBox">
    <h1><small>a4 不想上班 出品</small>不想上班！<br>放置辦公室</h1>
    <p>打倒改稿單、奧客電話和無限會議，<br>帶大家準時下班！</p>
    <button id="btnStart" class="big">開始上班</button>
    <p class="note">免費・不用登入・進度存在這台裝置</p>
  </div>
</div>

<div id="story" class="overlay" hidden>
  <div class="dlg">
    <div class="who"><div class="face"></div><b class="name"></b></div>
    <p class="text"></p>
    <span class="next">點一下繼續 ▶</span>
  </div>
</div>

<div id="modal" class="overlay" hidden><div class="box"></div></div>
<div id="toasts"></div>

<script src="js/data.js?v=2"></script>
<script src="js/engine.js?v=2"></script>
<script src="js/audio.js?v=2"></script>
<script src="js/render.js?v=2"></script>
<script src="js/ui.js?v=2"></script>
</body>
</html>
